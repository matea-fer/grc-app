<div class="login-screen">
  <div class="survey-form-card login-card">
    <h3>Prijava</h3>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="form-field">
      <label class="form-field-label" for="username">Korisničko ime</label>
      <input
        id="username"
        type="text"
        autocomplete="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        (keyup.enter)="submit()"
      />
    </div>

    <div class="form-field">
      <label class="form-field-label" for="password">Lozinka</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        (keyup.enter)="submit()"
      />
    </div>

    <div class="form-actions">
      <button type="button" class="primary" [disabled]="busy()" (click)="submit()">
        {{ busy() ? 'Prijava…' : 'Prijavi se' }}
      </button>
    </div>
  </div>
</div>
