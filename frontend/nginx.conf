# Servira Angular statiku + proxyja /api na backend servis (u prod nema ng-serve proxyja).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Veci SBOM upload nego nginx default (1m) - mora se slagati s app.sbom.max-file-size-kb.
    client_max_body_size 25m;

    # API ide na backend (naziv servisa iz docker-compose mreze).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: sve nepoznate rute vrati na index.html (Angular router preuzme).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
