spring.application.name=demo
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demo_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
# Oblik baze vodi Flyway (src/main/resources/db/migration), ne Hibernate.
#
# "validate" znaci: pri pokretanju SAMO usporedi entitete s bazom i odbij se pokrenuti
# ako se ne slazu. Prije je ovdje stajalo "update", koje je shemu pogadalo iz entiteta -
# ali je znalo samo DODAVATI: postojeca ogranicenja nije mijenjalo nikad, pa je nova
# vrijednost u enumu (TENANT_ADMIN) ostala odbijana starim CHECK-om, bez ijednog
# upozorenja. Sada je takav nesklad greska pri pokretanju, a ne 500 pri prvom upisu.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.sql.init.mode=never

# Postojeca baza nema povijest migracija, a nije prazna. baseline-on-migrate joj pri
# prvom pokretanju upise pocetno stanje (verzija 1) i preskoci sve migracije do te
# verzije - V1 opisuje ono sto u njoj vec postoji. Prazna baza nema sto oznaciti, pa
# na njoj V1 uredno prode i napravi shemu.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Zatecena shema prije uvodenja Flywaya

# Tajna za potpisivanje JWT-a. Namjerno bez defaulta - aplikacija se ne smije podici
# s ugradenom tajnom, isto kao sto se ne smije podici bez DB_PASSWORD.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:8}
# Lozinka pocetnog ADMIN racuna; koristi se samo pri prvom pokretanju prazne baze.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin}

# Prilozene datoteke. Granica postoji na dva mjesta i to je namjerno: Springova vrijedi za
# svaki multipart zahtjev i odbija ga prije nego stigne do koda, a app.upload je pravilo ove
# znacajke (AttachmentService). Springova je nesto veca, da granicu prvi objasni nas kod, uz
# razumljivu poruku, umjesto da zahtjev padne na rubu posluzitelja.
app.upload.max-file-size-kb=${UPLOAD_MAX_FILE_SIZE_KB:5120}
# Podignuto s 6MB na 20MB zbog SBOM-a, koji za vece projekte zna biti nekoliko MB.
# Prilozi (AttachmentService) i dalje imaju svoju, mnogo nizu granicu (app.upload).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- SBOM evaluacija (custom znacajka) ---
# Nacin pokretanja Grypea:
#   cli    - lokalna grype binarka (treba instalaciju na hostu; koristi app.sbom.grype-path)
#   docker - grype u kontejneru anchore/grype (NE treba lokalna instalacija, treba Docker)
app.sbom.mode=${SBOM_MODE:cli}

# CLI nacin: putanja do Grype izvrsne. "grype" se oslanja na PATH; inace puna putanja u
# backend/.env (GRYPE_PATH), npr. C:\...\grype.exe
app.sbom.grype-path=${GRYPE_PATH:grype}

# DOCKER nacin: izvrsni docker, slika, i IMENOVANI volumen za bazu ranjivosti (da prezivi
# --rm i da se ne skida svaki put). Prvi run povuce sliku i bazu (treba mreza); poslije radi
# i offline. Volumen se stvara sam pri prvom pokretanju.
app.sbom.docker-path=${DOCKER_PATH:docker}
app.sbom.docker-image=${GRYPE_IMAGE:anchore/grype:latest}
app.sbom.docker-db-volume=${GRYPE_DB_VOLUME:grc-grype-db}

# Koliko dugo se ceka Grype prije nego se analiza oznaci kao neuspjela. U docker nacinu prvi
# run (pull slike + baza) zna trajati dulje - po potrebi povecaj SBOM_TIMEOUT_SECONDS.
app.sbom.timeout-seconds=${SBOM_TIMEOUT_SECONDS:300}
# Najveci SBOM koji se prihvaca (KB). Ostaje ispod Springove multipart granice iznad.
app.sbom.max-file-size-kb=${SBOM_MAX_FILE_SIZE_KB:20480}