name: test-and-build

# Tok:
#   push u main   -> test + build "kandidat" slika (:edge, :sha)  — BEZ deploya na prod
#   tag v*        -> test + build (:latest, :<verzija>, :sha) + DEPLOY na prod
# Tako main nikad ne dira produkciju; prod je namjeran cin (tag) nakon sto si na stagingu
# potvrdila da nova verzija radi.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: grc_test
      DB_USER: postgres
      DB_PASSWORD: testpw
      JWT_SECRET: ci-tajna-samo-za-testove-dovoljno-duga-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Testovi (core + business, prava baza)
        working-directory: backend
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean test

  images:
    needs: test          # slike se grade SAMO ako testovi prodju
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prijava na GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagovi ovise o tome je li push na main (kandidat: edge) ili tag v* (izdanje: latest + verzija).
      - name: Tagovi (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grc-app-backend
          tags: |
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Backend slika
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Tagovi (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grc-app-frontend
          tags: |
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Frontend slika
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  deploy:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')    # <-- PROD SAMO NA TAG v*
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na Droplet (pull + restart)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/grc-app
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
