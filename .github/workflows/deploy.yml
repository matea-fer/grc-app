name: test-and-build

# Prvo testovi (uz pravu Postgres bazu). Slike (backend + frontend) se grade i objavljuju
# na GHCR SAMO ako testovi prodju (job "images" ima needs: test). Padnu li testovi, slike se
# ne objave -> nova verzija se ne moze deployati.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Prava Postgres baza za @SpringBootTest / @Transactional testove (nema Testcontainersa).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      # Backend cita ove kroz Spring env (application.properties: ${DB_HOST} itd.).
      # JWT_SECRET nema default pa se MORA postaviti, inace se test-kontekst ne digne.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: grc_test
      DB_USER: postgres
      DB_PASSWORD: testpw
      JWT_SECRET: ci-tajna-samo-za-testove-dovoljno-duga-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Testovi (core + business, prava baza)
        working-directory: backend
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean test

  images:
    needs: test          # <-- gradi se SAMO ako "test" prodje
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prijava na GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend slika
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/grc-app-backend:latest
            ghcr.io/${{ github.repository_owner }}/grc-app-backend:${{ github.sha }}

      - name: Frontend slika
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/grc-app-frontend:latest
            ghcr.io/${{ github.repository_owner }}/grc-app-frontend:${{ github.sha }}
