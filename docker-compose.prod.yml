# Produkcijski stack: Postgres + backend (Spring Boot + grype u slici) + frontend (nginx).
# Slike se grade u CI-ju i objavljuju na GHCR; Droplet ih samo povlaci (ne gradi lokalno).
#
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Nadogradnja = nova slika (novi TAG ili :latest) pa ponovno pull + up -d; Flyway sam
# primijeni nove migracije pri pokretanju backenda.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data   # trajnost: NE brisati (docker compose down BEZ -v)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: ghcr.io/${GH_OWNER:-matea-fer}/grc-app-backend:${TAG:-latest}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SBOM_MODE: cli
      JAVA_OPTS: ${JAVA_OPTS:--Xmx256m}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Backend se NE objavljuje na host - dostupan je samo frontendu kroz internu mrezu.

  frontend:
    image: ghcr.io/${GH_OWNER:-matea-fer}/grc-app-frontend:${TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
